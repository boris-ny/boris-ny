<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Boris Nyilindekwe, Full-Stack Software Engineer, Kigali, Rwanda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .name { fill: #0f172a; font-size: 56px; font-weight: 700; letter-spacing: -1px; }
      .role { fill: url(#accent); font-size: 26px; font-weight: 600; }
      .meta { fill: #475569; font-size: 18px; }
      .prompt { fill: #0891b2; font-size: 18px; }
      .line { fill: #334155; font-size: 18px; opacity: 0; }
      .l1 { animation: cycle 12s infinite -0.6s; }
      .l2 { animation: cycle 12s infinite 3.4s; }
      .l3 { animation: cycle 12s infinite 7.4s; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(6px); }
        4%, 29% { opacity: 1; transform: translateY(0); }
        33%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      .cursor { fill: #0891b2; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb { animation: float 8s ease-in-out infinite; }
      .orb2 { animation: float 10s ease-in-out infinite reverse; }
      @keyframes float { 50% { transform: translateY(-10px); } }
      .code { fill: none; stroke-width: 2; stroke-linecap: round; }
      .dash { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- stack diagram: client → api → db -->
    <g transform="translate(820 70)">
      <path class="code dash" d="M80 40 H200" stroke="#818cf8" stroke-opacity="0.7"/>
      <path class="code dash" d="M240 80 V140" stroke="#c084fc" stroke-opacity="0.7"/>
      <path class="code dash" d="M200 180 H80" stroke="#22d3ee" stroke-opacity="0.7"/>

      <g class="orb">
        <rect x="0" y="10" width="80" height="60" rx="12" fill="#ffffff" stroke="#818cf8" stroke-opacity="0.6"/>
        <text x="40" y="47" text-anchor="middle" class="mono" fill="#4338ca" font-size="15">&lt;UI/&gt;</text>
      </g>
      <g class="orb2">
        <rect x="200" y="10" width="80" height="60" rx="12" fill="#ffffff" stroke="#c084fc" stroke-opacity="0.6"/>
        <text x="240" y="47" text-anchor="middle" class="mono" fill="#7e22ce" font-size="15">API</text>
      </g>
      <g class="orb">
        <rect x="200" y="150" width="80" height="60" rx="12" fill="#ffffff" stroke="#22d3ee" stroke-opacity="0.6"/>
        <text x="240" y="187" text-anchor="middle" class="mono" fill="#0e7490" font-size="15">DB</text>
      </g>
      <g class="orb2">
        <rect x="0" y="150" width="80" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-opacity="0.5"/>
        <text x="40" y="187" text-anchor="middle" class="mono" fill="#334155" font-size="15">ship</text>
      </g>
    </g>

    <text x="64" y="112" class="sans name">Boris Nyilindekwe</text>
    <text x="66" y="156" class="sans role">Full-Stack Software Engineer</text>
    <text x="66" y="190" class="sans meta">📍 Kigali, Rwanda  ·  TypeScript · React · Node.js · PostgreSQL</text>

    <g transform="translate(66 250)">
      <text class="mono prompt">$</text>
      <text x="22" class="mono line l1">building web apps end to end, from schema to UI<tspan class="cursor"> ▍</tspan></text>
      <text x="22" class="mono line l2">shipping production sites for real clients<tspan class="cursor"> ▍</tspan></text>
      <text x="22" class="mono line l3">currently exploring event-driven backends<tspan class="cursor"> ▍</tspan></text>
    </g>

    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
